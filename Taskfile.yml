version: '3'

tasks:
  setup:
    desc: バックエンドとフロントエンドの開発依存関係をセットアップします
    cmds:
      - go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - go mod download
      - cd frontend && npm install

  dev:
    desc: ホットリロード対応の開発サーバーを起動します
    cmds:
      - wails dev

  build:
    desc: 本番用バイナリをビルドします
    cmds:
      - wails build -ldflags "-X main.Version={{.VERSION | default "0.0.0-dev"}}"

  build:universal:
    desc: macOSユニバーサル本番用バイナリをビルドします
    cmds:
      - wails build -platform darwin/universal -ldflags "-X main.Version={{.VERSION | default "0.0.0-dev"}}"

  install:mac:
    desc: 既存 of /Applications 内アプリを置き換えて再配置します
    cmds:
      - rm -rf /Applications/codex-session-display.app
      - task build
      - cp -R build/bin/codex-session-display.app /Applications/

  package:dmg:
    desc: DMG形式のインストーラーを作成します
    deps:
      - build:universal
    cmds:
      - which create-dmg > /dev/null || brew install create-dmg
      - rm -rf build/dmg-temp
      - rm -f build/bin/codex-session-display.dmg
      - mkdir -p build/dmg-temp
      - cp -R build/bin/codex-session-display.app build/dmg-temp/
      - |
        create-dmg \
          --volname "codex-session-display" \
          --volicon "build/dmg-temp/codex-session-display.app/Contents/Resources/iconfile.icns" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "codex-session-display.app" 150 200 \
          --hide-extension "codex-session-display.app" \
          --app-drop-link 450 200 \
          "build/bin/codex-session-display.dmg" \
          "build/dmg-temp/" || {
            echo "AppleScript execution failed (common in sandboxed or headless environments)."
            echo "Retrying with --skip-jenkins (skipping Finder customization)..."
            rm -f "build/bin/codex-session-display.dmg"
            create-dmg \
              --volname "codex-session-display" \
              --volicon "build/dmg-temp/codex-session-display.app/Contents/Resources/iconfile.icns" \
              --skip-jenkins \
              "build/bin/codex-session-display.dmg" \
              "build/dmg-temp/"
          }
      - rm -rf build/dmg-temp

  package:zip:
    desc: 自動アップデート用のZIPファイルを作成します
    cmds:
      - rm -f build/bin/codex-session-display.zip
      - cd build/bin && zip -r codex-session-display.zip codex-session-display.app

  test:
    desc: バックエンドのテストを実行します
    cmds:
      - go test ./...
      - go test -tags production ./...

  test:e2e:
    desc: 成功ログを抑制してフロントエンドの全E2Eテストを実行します
    cmds:
      - cd frontend && npx playwright test

  test:e2e:detail:
    desc: 対象を絞り、Playwright標準の詳細ログでE2Eテストを実行します
    cmds:
      - cd frontend && npx playwright test --reporter=line {{.CLI_ARGS}}

  test:e2e:ui:
    desc: フロントエンドのE2EテストをUIモードで実行します
    cmds:
      - cd frontend && npx playwright test --ui

  test:e2e:cover:
    desc: フロントエンドのE2Eテストを実行し、テストカバレッジを測定してHTMLで表示します
    cmds:
      - cd frontend && rm -rf .nyc_output coverage-e2e
      - cd frontend && VITE_COVERAGE=true npx playwright test
      - cd frontend && npx nyc report


  cover:
    desc: バックエンドのテストカバレッジを測定し、HTMLで表示します
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  lint:
    desc: バックエンドとフロントエンドのリンターを実行します
    cmds:
      - golangci-lint run
      - cd frontend && npm run lint

  fmt:
    desc: バックエンドとフロントエンドのコードをフォーマットします
    cmds:
      - golangci-lint run --fix
      - cd frontend && npm run lint:write

  clean:
    desc: ビルド成果物や一時ファイルをクリーンアップします
    cmds:
      - rm -rf build/
      - rm -f coverage.out

  clean:cache:
    desc: 解析キャッシュのJSONファイルを削除します
    cmds:
      - rm -f ~/.codex-display/*.json

  clean:cache:claude:
    desc: Claude Codeの解析キャッシュのJSONファイルを削除します
    cmds:
      - rm -f ~/.codex-display/claude-*.json
